# The test dancer (docs/DANCE-SPRITES.md, Appendix C.10). It uses every
# manifest key, and `python tools/dancepack.py builtin` compiles it into
# test/support/dance/TestPack.h, the fixture of the C++ reader and engine
# tests (steps 2-3). The geometry, the cells' roles and the moves are fixed,
# because tests name them; the art (sheet.txt, rendered to sheet.png) is free.
# It compiles under --strict with no skipped move: big is amber, heavy red
# and kept, every other move green.

[dancer]
name         = Tëst                     ; non-ASCII, inside the fonts' coverage
author       = IrosTheBeggar
license      = GPL-3.0-or-later
url          = https://github.com/IrosTheBeggar/mstream-mp3-player
version      = 1.0
sheet        = sheet.png
cell         = 24x32
scale        = 4                        ; 96x128 on screen
anchor       = 12,30
rest         = A1
shadow       = 35                       ; odd: B.5's sw // 2 rounds
format       = 1
key          = #ff00ff                  ; the sheet is RGB: magenta is transparent
palette      = #f0f0f8 #a8acc0 #f472b6 #ffd84a
idle_palette = #b0b0b8 #707484 #9a5a7c #a89050
faces        = right
x-note       = keys starting with x- are ignored

[move bounce]
row    = 1                              ; A1 B1 C1 D1: C1 is a pixel copy of A1
beats  = 2
bpm    = any
bounce = 3
freeze = yes

[move pulse]
frames = A1 B1 D1 B1
beats  = 1
bpm    = any
timing = 1/4 0.25 1/4 0.26              ; 0.26 snaps to 1/4, with a warning
offset = 0,0 0,-1 0,-2 0,-1
ease   = out
snap   = yes
sway   = 1                              ; a 1-beat sway: b counts beats since the run started

[move step-touch]
frames = A2 B2 A2 B2                    ; B2 is A2's mirror image
beats  = 2
bpm    = any
mirror = yes
sway   = 2
from   = stand
to     = stand
offset = 0,0 -1,0 0,0 1,0
ease   = linear out in hold

[move point]
frames = A3 B3 C3 B3
beats  = 4
timing = 1/2 1/2 1 2
offset = 0,0 2,-2 4,-3 2,-2
ease   = inout
bpm    = 90-130
mirror = yes
place  = start
weight = 0.3
repeat = 2
from   = stand
to     = left                           ; its twin, right, is a pose key too

[move slow]
row    = 4                              ; A4, the blank B4, C4
beats  = 4
bpm    = 36-60                          ; half time only
weight = 2.5

[move fast]
frames = A5 B5 C5
beats  = 1
timing = 1/4 1/2 1/4
bpm    = 150-180                        ; double time on slower tracks
place  = end
from   = low
to     = stand

[move walk]
row         = 6
beats       = 4
bpm         = 90-140
mirror      = yes
travel      = 1                         ; from spot -1, or mirrored from +1
travel_ease = linear
start_at    = side
go          = 2-3

[move nod]
frames = A7 B7 A7
beats  = 1
timing = 1/3 1/3 1/3                    ; triplets
bpm    = 70-100
genre  = hip hop, R&B, drum n bass      ; dormant until tracks carry genres

[move future]
frames   = A1 B1
beats    = 2
bpm      = any
song_bpm = 160-180                      ; written with its needs bit; v1 skips it

[move big]
frames = A8 A8
beats  = 2
bpm    = 100-160
offset = -4,0 4,0                       ; amber: 128x128 px at the switch

[move heavy]
frames = A8 A8
beats  = 2
bpm    = any
offset = -12,0 12,0                     ; red: 192x128 px at the switch
heavy  = yes

[move sway]
frames = A9 B9
bpm    = none
timing = 2s 2s
offset = -2,0 2,0                       ; the feet slide with the offsets: a drift warning
ease   = inout
when   = any

[move breathe]
frames = A10 B10 C10
bpm    = none
timing = 1.1s 1.1s 1.1s                 ; 3.3 s: at 30 fps a play ends exactly on frame 100
when   = quiet

[move look]
frames = A11 B11 A11
bpm    = none
timing = 500ms 1s 1.5s
when   = listening
mirror = yes
