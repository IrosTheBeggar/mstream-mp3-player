# SPDX-License-Identifier: GPL-3.0-or-later
# The reference reader for the tag parity corpus (docs/METADATA.md 2.17,
# item 3): lofty 0.25 as mStream's rust-parser reads with it, and part 5.
# A host tool, never part of the firmware. See src/main.rs.
[package]
name = "tagref"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lofty = "=0.25.1"
serde_json = "1"

[profile.dev]
opt-level = 1
