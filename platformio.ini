; mstream-mp3-player — portable MP3/FLAC player on the M5Stack Core2 that syncs
; its library from an mStream server.
;
; Two build targets:
;   core2  : the firmware for the M5Stack Core2 (original ESP32, 16MB flash, 8MB PSRAM).
;   native : host build of the portable core logic for fast unit tests (no board needed).
;
; The portable logic lives in lib/core (framework-agnostic C++17) so it compiles for `native`.
; Anything that touches hardware lives in src/ and is NOT built for native.

[platformio]
default_envs = core2
; Optional, gitignored per-developer overrides — see [local] below.
extra_configs = local*.ini

; Per-developer build flags. Override in a gitignored local.ini, e.g. to pick
; which Bluetooth headphones to connect to:
;   [local]
;   build_flags = -DBT_SINK_NAME=\"WH-1000XM4\"
[local]
build_flags =

; ---------------------------------------------------------------------------
; Firmware for the M5Stack Core2
; ---------------------------------------------------------------------------
[env:core2]
; pioarduino: Arduino-ESP32 core 3.3.12 on ESP-IDF 5.5.5 (needs PlatformIO Core >= 6.2.0).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-core2
framework = arduino
; Two 6MB OTA slots, NVS above anything a single-file install at 0x0 writes,
; 3.8MB LittleFS: see partitions.csv (it can never change after release).
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; pioarduino defaults to linking every library object, used or not (ESP8266Audio
; would drag in HTTPClient + networking).
lib_archive = yes
; iram_diet frees ~9 KB of the ESP32's 128 KB IRAM, which Bluetooth + M5Unified
; overflow; flash_guard fails the build if the app outgrows its slot, the
; merged firmware.factory.bin is missing or would reach NVS, or the table isn't
; the one the firmware expects. See each script's docstring.
extra_scripts =
  post:tools/iram_diet.py
  post:tools/flash_guard.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  ; ESP32-A2DP warns that verbose core logging can disturb audio timing.
  -DCORE_DEBUG_LEVEL=2
  ; libmad's 64-bit multiplies instead of its low-precision default
  ; (decoder SNR ~55 dB -> ~81 dB; checked with the console's bench).
  -DFPM_64BIT
  ${local.build_flags}
lib_deps =
  m5stack/M5Unified@0.2.23
  m5stack/M5GFX@0.2.30
  ; The registry only has 2.4.1; 2.4.2 is the release for Arduino core 3.x.
  https://github.com/earlephilhower/ESP8266Audio.git#2.4.2
  ; Not in the PlatformIO registry. Pinned to the exact tag: src/audio/BtSink.cpp
  ; subclasses it and relies on its protected members and file-local constants
  ; (listed above class PlayerA2dp); re-check those on any upgrade.
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11

; ---------------------------------------------------------------------------
; Host unit tests for the portable core (lib/core). Run: pio test -e native
; Requires a host C/C++ compiler (MinGW-w64 or MSVC on Windows).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  ; test_ui_library measures the tab bar's texts with the firmware's own
  ; font data (src/ui/VlwFonts.cpp: arrays only).
  -I src
