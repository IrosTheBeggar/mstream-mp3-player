; mstream-mp3-player — ESP32-S3 portable player that docks to an mStream server.
;
; Three build targets:
;   esp32-s3-wokwi : the firmware, configured for the Wokwi simulator (ILI9341 stand-in display).
;   hardware       : the same firmware for the real board (ST7789 panel).
;   native         : host build of the portable core logic for fast unit tests (no board needed).
;
; The portable logic lives in lib/core (framework-agnostic C++17) so it compiles for `native`.
; Anything that touches hardware lives in src/ behind a HAL interface and is NOT built for native.

[platformio]
default_envs = esp32-s3-wokwi

; ---------------------------------------------------------------------------
; Shared display + library config (no User_Setup.h edits — all via build flags)
; ---------------------------------------------------------------------------
[common]
build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; ---- TFT_eSPI pin + feature config ----
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=13
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=8
  -DTFT_BL=14
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_GFXFF
  -DSMOOTH_FONT
  -DSPI_FREQUENCY=27000000
  ; ---- Input + peripheral pins (see include/Pins.h) ----
  -DPIN_SD_CS=7
  -DPIN_ENC_CLK=4
  -DPIN_ENC_DT=5
  -DPIN_ENC_SW=6
  -DPIN_BTN_PLAY=15
  -DPIN_BTN_PREV=16
  -DPIN_BTN_NEXT=17
  -DPIN_DOCK=18
lib_deps =
  bodmer/TFT_eSPI@^2.5.43

; ---------------------------------------------------------------------------
; Firmware for the Wokwi simulator
; ---------------------------------------------------------------------------
[env:esp32-s3-wokwi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; N16R8 module: 16MB flash, 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DILI9341_DRIVER=1          ; Wokwi's display part; identical SPI wiring to the ST7789
lib_deps =
  ${common.lib_deps}

; ---------------------------------------------------------------------------
; Firmware for the real board (1.9" ST7789). Same code, different panel driver.
; On hardware the SD card moves to 4-bit SDIO (SD_MMC) — see docs/ARCHITECTURE.md.
; ---------------------------------------------------------------------------
[env:hardware]
extends = env:esp32-s3-wokwi
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DST7789_DRIVER=1

; ---------------------------------------------------------------------------
; Host unit tests for the portable core (lib/core). Run: pio test -e native
; Requires a host C/C++ compiler (MinGW-w64 or MSVC on Windows).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
