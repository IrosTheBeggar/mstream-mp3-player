; mstream-mp3-player — portable MP3/FLAC player on the M5Stack Core2 that syncs
; its library from an mStream server.
;
; Build targets:
;   core2     : the firmware for the M5Stack Core2 (original ESP32, 16MB flash, 8MB PSRAM),
;               flash in QIO at 80 MHz.
;   core2-dio : the same firmware with the flash in DIO at 40 MHz, as M5 ships the
;               Core2: every release carries it as the fallback (-dio-full.bin).
;   native    : host build of the portable core logic for fast unit tests (no board needed).
;
; The portable logic lives in lib/core (framework-agnostic C++17) so it compiles for `native`.
; Anything that touches hardware lives in src/ and is NOT built for native.

[platformio]
default_envs = core2
; Optional, gitignored per-developer overrides — see [local] below.
extra_configs = local*.ini

; Per-developer build flags. Override in a gitignored local.ini, e.g. to pick
; which Bluetooth headphones to connect to:
;   [local]
;   build_flags = -DBT_SINK_NAME=\"WH-1000XM4\"
[local]
build_flags =

; ---------------------------------------------------------------------------
; Firmware for the M5Stack Core2
; ---------------------------------------------------------------------------
[env:core2]
; pioarduino: Arduino-ESP32 core 3.3.12 on ESP-IDF 5.5.5 (needs PlatformIO Core >= 6.2.0).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-core2
framework = arduino
; Two 6MB OTA slots, NVS above anything a single-file install at 0x0 writes,
; 3.8MB LittleFS: see partitions.csv (it can never change after release).
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; pioarduino defaults to linking every library object, used or not (ESP8266Audio
; would drag in HTTPClient + networking).
lib_archive = yes
; version names the build from git (v0.5.0, v0.5.0-3-gabc1234-dirty) and,
; with RELEASE=1, refuses anything but a clean tagged tree with no local
; flags; iram_diet frees ~9 KB of the ESP32's 128 KB IRAM, which Bluetooth +
; M5Unified overflow; flash_guard fails the build if the app outgrows its
; slot, the merged firmware.factory.bin is missing or would reach NVS, or the
; table isn't the one the firmware expects; no_psram_fix compiles our code
; (src/, lib/core, the libraries, the Arduino core) without the rev-1 PSRAM
; cache workaround, which the Core2's rev-3 chip doesn't need (main.cpp
; halts on an older one). See each script's docstring.
extra_scripts =
  pre:tools/version.py
  pre:tools/no_psram_fix.py
  post:tools/iram_diet.py
  post:tools/flash_guard.py
; Flash: QIO at 80 MHz (the default from 0.6.0; docs/ENERGY.md section 5,
; P2). The board JSON (and M5) say DIO at 40 MHz; QIO moves 4 bits a clock
; instead of 2, so everything that runs from flash gains (measured: list
; scrolling with an MP3 +65 % at 240 MHz, MP3 decode -9 %). The build makes
; the bootloader from bootloader_qio_80m.elf (the build log names it) and
; links the qio_qspi libs. Both image headers still say DIO, byte 2 of
; bootloader.bin = 0x02: the ROM loads the bootloader in DIO and the
; bootloader turns quad on itself (pioarduino, like M5's boards.txt, maps
; qio to dio in the app header); byte 3 = 0x4F (16 MB, 80 MHz).
; flash_guard checks the bootloader against these (byte 3's frequency; the
; QIO code only in a QIO build) and records the mode for
; tools/package_release.py, which wants this build QIO and core2-dio DIO.
; A unit whose flash can't take QIO keeps restarting: core2-dio below is the
; fallback, in every release.
board_build.flash_mode = qio
board_build.f_flash = 80000000L
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  ; ESP32-A2DP warns that verbose core logging can disturb audio timing.
  -DCORE_DEBUG_LEVEL=2
  ; libmad's 64-bit multiplies instead of its low-precision default
  ; (decoder SNR ~55 dB -> ~81 dB; checked with the console's bench).
  -DFPM_64BIT
  ${local.build_flags}
lib_deps =
  m5stack/M5Unified@0.2.23
  m5stack/M5GFX@0.2.30
  ; The two git dependencies are pinned by the commit their tag named when
  ; pinned, not the tag, so a re-tag can't change the source a release was
  ; built from (the Corresponding Source: THIRD-PARTY-NOTICES.md).
  ; The registry only has 2.4.1; 2.4.2 is the release for Arduino core 3.x.
  ; Tag 2.4.2:
  https://github.com/earlephilhower/ESP8266Audio.git#74fc1f09bbba5e5c5450b445452ba64ef2d8bbad
  ; Not in the PlatformIO registry. Pinned exactly: src/audio/BtSink.cpp
  ; subclasses it and relies on its protected members and file-local constants
  ; (listed above class PlayerA2dp); re-check those on any upgrade.
  ; Tag v1.8.11:
  https://github.com/pschatzmann/ESP32-A2DP.git#b6da4744286ca15b6f1dee607c077a4747294dd4

; ---------------------------------------------------------------------------
; The fallback: the same firmware with the flash in DIO at 40 MHz, as M5 ships
; the Core2 and as v0.5.0 was released. CI builds it beside core2 and every
; release carries its merged image as mstream-player-core2-<version>-dio-full.bin,
; for a Core2 that keeps restarting on QIO (README, "Installing and updating").
; pio run -e core2-dio -t upload
; (DIO at 80 MHz, the old [env:core2-dio80], benched the same as at 40: the
; app runs the flash at 80 MHz after the PSRAM init either way, and QIO's gain
; is the 4 data lines; docs/ENERGY.md section 5, "Audit 2: measured".)
; ---------------------------------------------------------------------------
[env:core2-dio]
extends = env:core2
board_build.flash_mode = dio
board_build.f_flash = 40000000L

; ---------------------------------------------------------------------------
; A/B build for docs/ENERGY.md section 5 (measured from a fresh boot against
; core2; never released): pio run -e core2-psramfix -t upload
; ---------------------------------------------------------------------------
; P3a's "before": the rev-1 PSRAM workaround kept in every compile
; (tools/no_psram_fix.py). QIO, as core2.
[env:core2-psramfix]
extends = env:core2
custom_psram_cache_fix = keep

; ---------------------------------------------------------------------------
; Host unit tests for the portable core (lib/core). Run: pio test -e native
; Requires a host C/C++ compiler (MinGW-w64 or MSVC on Windows).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  ; test_ui_library measures the tab bar's texts with the firmware's own
  ; font data (src/ui/VlwFonts.cpp: arrays only).
  -I src
